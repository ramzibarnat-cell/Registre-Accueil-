<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Registre des demandes — Accueil</title>
<style>
  :root{
    --navy:#1e3450;
    --navy-deep:#142434;
    --paper:#f6f4ef;
    --card:#ffffff;
    --ink:#1f2937;
    --muted:#6b7280;
    --line:#e4e0d6;
    --gold:#b6822f;
    --urgent:#b3432f;
    --urgent-bg:#fbe9e4;
    --ok:#3f7a5c;
    --ok-bg:#e6f0ea;
    --new-bg:#eef2f8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: "Segoe UI", Arial, sans-serif;
    background:var(--paper);
    color:var(--ink);
  }
  .topbar{
    background:var(--navy);
    color:#fff;
    padding:16px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:12px;
  }
  .topbar h1{
    font-size:19px;
    margin:0;
    font-weight:600;
    letter-spacing:.2px;
  }
  .topbar .sub{
    font-size:12.5px;
    color:#c7d2e0;
    margin-top:2px;
  }
  .identity{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13.5px;
  }
  .identity select, .identity input{
    padding:6px 10px;
    border-radius:6px;
    border:1px solid #34506e;
    background:#25405c;
    color:#fff;
    font-size:13.5px;
  }
  .identity select option{color:#111;}
  .bell{
    position:relative;
    background:#25405c;
    border:1px solid #34506e;
    color:#fff;
    padding:6px 10px;
    border-radius:6px;
    cursor:pointer;
    font-size:13px;
  }
  .bell.on{background:var(--gold); border-color:var(--gold); color:#2a1c02;}
  .badge{
    position:absolute; top:-6px; right:-6px;
    background:var(--urgent); color:#fff;
    font-size:11px; font-weight:700;
    border-radius:10px; padding:1px 6px;
    display:none;
  }
  .wrap{
    max-width:1180px;
    margin:0 auto;
    padding:20px 24px 60px;
    display:grid;
    grid-template-columns: 340px 1fr;
    gap:20px;
  }
  @media (max-width: 860px){
    .wrap{grid-template-columns: 1fr;}
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:18px;
  }
  .card h2{
    font-size:14px;
    text-transform:uppercase;
    letter-spacing:.6px;
    color:var(--navy);
    margin:0 0 14px 0;
    font-weight:700;
  }
  label{
    display:block;
    font-size:12.5px;
    color:var(--muted);
    margin:10px 0 4px;
  }
  input[type=text], input[type=tel], input[type=password], select, textarea{
    width:100%;
    padding:9px 10px;
    border:1px solid var(--line);
    border-radius:6px;
    font-size:14px;
    font-family:inherit;
    background:#fff;
    color:var(--ink);
  }
  textarea{resize:vertical; min-height:56px;}
  .radio-row{display:flex; gap:14px; margin-top:6px;}
  .radio-row label{display:flex; align-items:center; gap:6px; font-size:13.5px; color:var(--ink); margin:0;}
  .radio-row input{width:auto;}
  button.primary{
    margin-top:16px;
    width:100%;
    background:var(--navy);
    color:#fff;
    border:none;
    padding:11px;
    border-radius:6px;
    font-size:14.5px;
    font-weight:600;
    cursor:pointer;
  }
  button.primary:hover{background:var(--navy-deep);}
  .staff-manage{
    margin-top:18px;
    padding-top:14px;
    border-top:1px dashed var(--line);
  }
  .staff-manage .row{display:flex; gap:6px;}
  .staff-manage input{flex:1;}
  .staff-manage button{
    background:#eee; border:1px solid var(--line); border-radius:6px;
    padding:0 12px; cursor:pointer; font-size:13px;
  }
  .staff-list{margin-top:8px; font-size:13px; color:var(--muted);}
  .staff-row{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    padding:7px 0; border-bottom:1px solid var(--line);
  }
  .staff-row:last-child{border-bottom:none;}
  .staff-name{font-weight:600; color:var(--ink); font-size:13.5px; flex:1; min-width:100px;}
  .pin-status{font-size:11px; padding:2px 8px; border-radius:10px; white-space:nowrap;}
  .pin-status.set{background:var(--ok-bg); color:var(--ok);}
  .pin-status.unset{background:#f0eee6; color:var(--muted);}
  .set-pin-btn{
    background:#eee; border:1px solid var(--line); border-radius:6px;
    padding:3px 9px; cursor:pointer; font-size:12px; color:var(--ink);
  }
  .rm-staff{
    background:none; border:none; color:var(--muted); cursor:pointer; font-size:14px; padding:0 2px;
  }
  .tabs{display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap;}
  .tab{
    padding:7px 14px; border-radius:16px; border:1px solid var(--line);
    background:#fff; font-size:13px; cursor:pointer; color:var(--muted);
  }
  .tab.active{background:var(--navy); border-color:var(--navy); color:#fff;}
  .search{margin-bottom:14px;}
  .ticket{
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px 16px;
    margin-bottom:12px;
    background:#fff;
  }
  .ticket.urgent{border-color:#e3b6a9; background:var(--urgent-bg);}
  .ticket.status-Traité{opacity:.72;}
  .t-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap:wrap;}
  .t-title{font-size:15px; font-weight:700; color:var(--navy);}
  .t-meta{font-size:12.5px; color:var(--muted); margin-top:2px;}
  .pill{
    font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.4px;
    padding:3px 9px; border-radius:12px; white-space:nowrap;
  }
  .pill.Nouveau{background:var(--new-bg); color:var(--navy);}
  .pill.Vu{background:#fff4e2; color:var(--gold);}
  .pill.Traité{background:var(--ok-bg); color:var(--ok);}
  .pill.urgent-flag{background:var(--urgent); color:#fff; margin-left:6px;}
  .t-body{margin-top:10px; font-size:14px; line-height:1.5;}
  .t-body .row{margin-bottom:3px;}
  .t-body b{color:var(--ink);}
  .t-actions{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;}
  .t-actions button{
    font-size:12.5px; border-radius:6px; border:1px solid var(--line);
    background:#f8f7f3; padding:6px 11px; cursor:pointer; color:var(--ink);
  }
  .t-actions button.go{background:var(--navy); color:#fff; border-color:var(--navy);}
  .responses{margin-top:10px; border-top:1px solid var(--line); padding-top:10px;}
  .resp{
    background:#f8f7f3; border-radius:8px; padding:8px 10px; font-size:13.5px; margin-bottom:6px;
  }
  .resp .who{font-weight:700; color:var(--navy); font-size:12.5px;}
  .reply-box{display:flex; gap:8px; margin-top:8px;}
  .reply-box textarea{flex:1; min-height:38px;}
  .reply-box button{
    background:var(--navy); color:#fff; border:none; border-radius:6px;
    padding:0 14px; cursor:pointer; font-size:13px;
  }
  .empty{color:var(--muted); font-size:13.5px; text-align:center; padding:30px 0;}
  .loading{color:var(--muted); font-size:13px; padding:10px 0;}
  .identity-status{font-size:13.5px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .modal-overlay{
    position:fixed; inset:0; background:rgba(15,25,35,.55);
    display:none; align-items:center; justify-content:center; z-index:100;
  }
  .modal-box{
    background:#fff; border-radius:10px; padding:22px 24px; width:320px; max-width:88vw;
    box-shadow:0 12px 34px rgba(0,0,0,.28);
  }
  .modal-box h3{margin:0 0 14px 0; font-size:15px; color:var(--navy);}
  .modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:16px;}
  .modal-actions button{
    padding:8px 14px; border-radius:6px; font-size:13px; cursor:pointer;
    border:1px solid var(--line); background:#f2f1ec;
  }
  .modal-actions button.go{background:var(--navy); color:#fff; border-color:var(--navy);}
  .modal-error{color:var(--urgent); font-size:12.5px; margin-top:8px; display:none;}
</style>
</head>
<body>

<div class="topbar">
  <div>
    <h1 id="mainTitle" style="cursor:default;">Registre des demandes — Accueil</h1>
    <div class="sub">Journal partagé, visible par toute l'administration</div>
  </div>
  <div class="identity">
    <div class="identity-status" id="identityArea"></div>
    <button class="bell" id="bellBtn" title="Activer les alertes sonores/visuelles">🔔 Alertes
      <span class="badge" id="badgeCount"></span>
    </button>
  </div>
</div>

<div class="wrap" id="wrapGrid">
  <!-- LEFT: reserved to Accueil only, unlocked with a PIN code -->
  <div class="card" id="leftPanel" style="display:none;">
    <h2>Nouvelle demande</h2>
    <label>Type de contact</label>
    <select id="f-type">
      <option>Appel téléphonique</option>
      <option>Visite à l'accueil</option>
      <option>Message écrit</option>
      <option>Autre</option>
    </select>

    <label>Nom du demandeur (parent, élève, visiteur...)</label>
    <input type="text" id="f-name" placeholder="Ex : M. Karray (parent de Ahmed, 4ème B)">

    <label>Téléphone / contact (optionnel)</label>
    <input type="tel" id="f-phone" placeholder="Ex : 98 123 456">

    <label>Objet de la demande</label>
    <textarea id="f-motif" placeholder="Ex : souhaite un rendez-vous avec le chef d'établissement au sujet de..."></textarea>

    <label>À transmettre à</label>
    <select id="f-dest"></select>

    <label>Urgence</label>
    <div class="radio-row">
      <label><input type="radio" name="urg" value="Normal" checked> Normal</label>
      <label><input type="radio" name="urg" value="Urgent"> Urgent</label>
    </div>

    <button class="primary" id="submitBtn">Enregistrer et transmettre</button>

    <div class="staff-manage">
      <h2 style="margin-bottom:8px;">Destinataires (personnel)</h2>
      <div class="row">
        <input type="text" id="newStaffName" placeholder="Ajouter une personne...">
        <button id="addStaffBtn">Ajouter</button>
      </div>
      <div class="staff-list" id="staffList"></div>
    </div>
  </div>

  <!-- RIGHT: ticket feed -->
  <div>
    <div class="tabs" id="tabs"></div>
    <input type="text" class="search" id="searchBox" placeholder="Rechercher (nom, motif...)" style="width:100%; padding:9px 12px; border:1px solid var(--line); border-radius:6px; font-size:14px;">
    <div id="scopeNote" style="font-size:12.5px; color:var(--muted); margin:8px 0 4px;"></div>
    <div id="ticketFeed"><div class="loading">Chargement du registre…</div></div>
  </div>
</div>

<!-- PIN modal, used both to enter and to create the Accueil access code -->
<div class="modal-overlay" id="pinModalOverlay">
  <div class="modal-box">
    <h3 id="pinModalTitle">Code d'accès — Espace Accueil</h3>
    <div id="pinModalBody"></div>
    <div class="modal-error" id="pinError"></div>
    <div class="modal-actions">
      <button id="pinCancelBtn">Annuler</button>
      <button id="pinConfirmBtn" class="go">Valider</button>
    </div>
  </div>
</div>

<script>
const DEFAULT_STAFF = ["M. Soulard", "M. Barouni", "Mme Sana", "Mme Najoua", "Mme Wafa", "Mme Samar", "Mme Mayssa", "Mme Aya A. (Assistante CPE)", "Mme Aya A. (Assistante Proviseur)"];
let staff = [];
let tickets = [];
let myName = null;
let currentTab = "Tous";
let seenIds = new Set();
let alertsOn = false;
let pollTimer = null;

// ---------- Google Apps Script backend (remplace window.storage) ----------
// Collez ici l'URL "Application Web" obtenue après déploiement du script Code.gs.
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyezm48D2lfVK4SJyHcDiQknHW8-KHR8P6OVXyfDbWoiICI4DgbBJe8rrEJ0E-iNqyG/exec";

async function gsGet(key){
  try{
    const res = await fetch(`${APPS_SCRIPT_URL}?key=${encodeURIComponent(key)}`);
    const data = await res.json();
    if(!data || data.value === null || data.value === undefined || data.value === "") return null;
    return { value: data.value };
  }catch(e){ return null; }
}
async function gsSet(key, value){
  try{
    await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({ key, value })
    });
    return { value };
  }catch(e){ return null; }
}

// ---------- storage helpers ----------
async function loadStaff(){
  try{
    const r = await gsGet('staff-list');
    staff = r ? JSON.parse(r.value) : DEFAULT_STAFF.slice();
  }catch(e){ staff = DEFAULT_STAFF.slice(); }
  if(!staff.length) staff = DEFAULT_STAFF.slice();
}
async function saveStaff(){
  await gsSet('staff-list', JSON.stringify(staff));
}
async function loadTickets(){
  try{
    const r = await gsGet('tickets');
    tickets = r ? JSON.parse(r.value) : [];
  }catch(e){ tickets = []; }
}
async function saveTickets(){
  await gsSet('tickets', JSON.stringify(tickets));
}
// L'identité "dont on se souvient sur cet appareil" reste locale au
// navigateur (localStorage) : ce n'est plus un artifact Claude, donc
// localStorage fonctionne normalement ici et c'est le bon choix pour une
// préférence propre à un seul poste/navigateur.
async function loadIdentity(){
  try{
    myName = localStorage.getItem('my-identity') || null;
  }catch(e){ myName = null; }
}
async function saveIdentity(name){
  myName = name;
  try{ localStorage.setItem('my-identity', name); }catch(e){}
}


// ---------- identity area & profile lock ----------
function renderIdentityArea(){
  const el = document.getElementById('identityArea');
  if(myName === "Accueil"){
    el.innerHTML = `
      <span>Connecté(e) : <b>Accueil</b></span>
      <button class="bell" id="logoutBtn">Quitter l'espace Accueil</button>
      <button class="bell" id="changePinBtn">Changer le code</button>
    `;
  } else if(myName && staff.includes(myName)){
    el.innerHTML = `
      <span>Connecté(e) : <b>${escapeHtml(myName)}</b></span>
      <button class="bell" id="switchProfileBtn">Changer de profil</button>
      <button class="bell" id="changeStaffPinBtn">Changer mon code</button>
    `;
  } else {
    el.innerHTML = `
      <span>Vous êtes :</span>
      <select id="identitySelect">
        <option value="">— Choisir —</option>
        ${staff.map(s => `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join('')}
      </select>
    `;
  }
  wireIdentityAreaEvents();
}

function wireIdentityAreaEvents(){
  if(myName === "Accueil"){
    document.getElementById('logoutBtn').onclick = logoutAccueil;
    document.getElementById('changePinBtn').onclick = ()=>{
      pinModalMode = 'change';
      showPinModal("Changer le code d'accès", `
        <label>Nouveau code (4 caractères ou plus)</label>
        <input type="password" id="pinInput1" inputmode="numeric" autocomplete="off">
        <label>Confirmer le nouveau code</label>
        <input type="password" id="pinInput2" inputmode="numeric" autocomplete="off">
      `);
    };
  } else if(myName && staff.includes(myName)){
    document.getElementById('switchProfileBtn').onclick = async ()=>{
      myName = null;
      await saveIdentity("");
      currentTab = "Mes demandes";
      afterIdentityChange();
    };
    document.getElementById('changeStaffPinBtn').onclick = ()=>{
      pinModalMode = 'changeStaff';
      pinModalTargetName = myName;
      showPinModal(`Changer votre code — ${myName}`, `
        <label>Nouveau code (4 caractères ou plus)</label>
        <input type="password" id="pinInput1" inputmode="numeric" autocomplete="off">
        <label>Confirmer le nouveau code</label>
        <input type="password" id="pinInput2" inputmode="numeric" autocomplete="off">
      `);
    };
  } else {
    document.getElementById('identitySelect').addEventListener('change', (e)=>{
      const val = e.target.value;
      if(!val) return;
      openStaffLock(val);
    });
  }
}

// ---------- per-staff PIN ----------
async function getStaffPins(){
  try{
    const r = await gsGet('staff-pins');
    return r ? JSON.parse(r.value) : {};
  }catch(e){ return {}; }
}
async function setStaffPin(name, pin){
  const pins = await getStaffPins();
  pins[name] = pin;
  await gsSet('staff-pins', JSON.stringify(pins));
}

async function openStaffLock(name){
  pinModalTargetName = name;
  const pins = await getStaffPins();
  if(!pins[name]){
    pinModalMode = 'setupStaff';
    showPinModal(`Créer votre code — ${name}`, `
      <label>Nouveau code (4 caractères ou plus)</label>
      <input type="password" id="pinInput1" inputmode="numeric" autocomplete="off">
      <label>Confirmer le code</label>
      <input type="password" id="pinInput2" inputmode="numeric" autocomplete="off">
    `);
  } else {
    pinModalMode = 'enterStaff';
    showPinModal(`Code d'accès — ${name}`, `
      <label>Votre code</label>
      <input type="password" id="pinInput1" inputmode="numeric" autocomplete="off">
    `);
  }
}

async function updateLayout(){
  const leftPanel = document.getElementById('leftPanel');
  const wrap = document.getElementById('wrapGrid');
  if(myName === "Accueil"){
    leftPanel.style.display = 'block';
    wrap.style.gridTemplateColumns = '340px 1fr';
  } else {
    leftPanel.style.display = 'none';
    wrap.style.gridTemplateColumns = '1fr';
  }
}

function afterIdentityChange(){
  renderIdentityArea();
  updateLayout();
  renderTabs();
  renderScopeNote();
  renderTickets();
  updateBadge(0);
}

async function logoutAccueil(){
  myName = null;
  await saveIdentity("");
  currentTab = "Mes demandes";
  afterIdentityChange();
}

// ---------- PIN modal ----------
let pinModalMode = 'enter'; // 'enter' | 'setup' | 'change' | 'setupStaff' | 'enterStaff' | 'changeStaff'
let pinModalTargetName = null;

async function getPin(){
  try{
    const r = await gsGet('accueil-pin');
    return r ? r.value : null;
  }catch(e){ return null; }
}
async function setPinValue(pin){
  await gsSet('accueil-pin', pin);
}

async function openAccueilLock(){
  const existing = await getPin();
  if(!existing){
    pinModalMode = 'setup';
    showPinModal("Créer le code d'accès de l'espace Accueil", `
      <label>Nouveau code (4 caractères ou plus)</label>
      <input type="password" id="pinInput1" inputmode="numeric" autocomplete="off">
      <label>Confirmer le code</label>
      <input type="password" id="pinInput2" inputmode="numeric" autocomplete="off">
    `);
  } else {
    pinModalMode = 'enter';
    showPinModal("Code d'accès — Espace Accueil", `
      <label>Code d'accès</label>
      <input type="password" id="pinInput1" inputmode="numeric" autocomplete="off">
    `);
  }
}

function showPinModal(title, bodyHtml){
  document.getElementById('pinModalTitle').textContent = title;
  document.getElementById('pinModalBody').innerHTML = bodyHtml;
  document.getElementById('pinError').style.display = 'none';
  document.getElementById('pinModalOverlay').style.display = 'flex';
  const first = document.getElementById('pinInput1');
  if(first){
    setTimeout(()=>first.focus(), 50);
    first.addEventListener('keydown', (e)=>{ if(e.key==='Enter') confirmPinModal(); });
  }
}
function hidePinModal(){
  document.getElementById('pinModalOverlay').style.display = 'none';
}
function cancelPinModal(){
  hidePinModal();
  if(pinModalMode === 'setupStaff' || pinModalMode === 'enterStaff'){
    const sel = document.getElementById('identitySelect');
    if(sel) sel.value = '';
  }
}

async function confirmPinModal(){
  const errEl = document.getElementById('pinError');
  const p1El = document.getElementById('pinInput1');
  const p2El = document.getElementById('pinInput2');
  const p1 = p1El ? p1El.value.trim() : '';
  const p2 = p2El ? p2El.value.trim() : '';

  if(pinModalMode === 'setup' || pinModalMode === 'change'){
    if(p1.length < 4){ errEl.textContent = 'Le code doit contenir au moins 4 caractères.'; errEl.style.display='block'; return; }
    if(p1 !== p2){ errEl.textContent = 'Les deux codes ne correspondent pas.'; errEl.style.display='block'; return; }
    await setPinValue(p1);
    if(pinModalMode === 'setup'){
      await saveIdentity("Accueil");
      myName = "Accueil";
      currentTab = "Tous";
      afterIdentityChange();
    }
    hidePinModal();
  } else if(pinModalMode === 'enter'){
    const real = await getPin();
    if(p1 !== real){ errEl.textContent = 'Code incorrect.'; errEl.style.display='block'; return; }
    await saveIdentity("Accueil");
    myName = "Accueil";
    currentTab = "Tous";
    afterIdentityChange();
    hidePinModal();
  } else if(pinModalMode === 'setupStaff'){
    if(p1.length < 4){ errEl.textContent = 'Le code doit contenir au moins 4 caractères.'; errEl.style.display='block'; return; }
    if(p1 !== p2){ errEl.textContent = 'Les deux codes ne correspondent pas.'; errEl.style.display='block'; return; }
    await setStaffPin(pinModalTargetName, p1);
    myName = pinModalTargetName;
    await saveIdentity(myName);
    currentTab = "Mes demandes";
    afterIdentityChange();
    hidePinModal();
  } else if(pinModalMode === 'enterStaff'){
    const pins = await getStaffPins();
    const real = pins[pinModalTargetName];
    if(p1 !== real){
      errEl.textContent = 'Code incorrect.'; errEl.style.display='block';
      return;
    }
    myName = pinModalTargetName;
    await saveIdentity(myName);
    currentTab = "Mes demandes";
    afterIdentityChange();
    hidePinModal();
  } else if(pinModalMode === 'changeStaff'){
    if(p1.length < 4){ errEl.textContent = 'Le code doit contenir au moins 4 caractères.'; errEl.style.display='block'; return; }
    if(p1 !== p2){ errEl.textContent = 'Les deux codes ne correspondent pas.'; errEl.style.display='block'; return; }
    await setStaffPin(pinModalTargetName, p1);
    hidePinModal();
  } else if(pinModalMode === 'setStaffByAdmin'){
    if(p1.length < 4){ errEl.textContent = 'Le code doit contenir au moins 4 caractères.'; errEl.style.display='block'; return; }
    if(p1 !== p2){ errEl.textContent = 'Les deux codes ne correspondent pas.'; errEl.style.display='block'; return; }
    await setStaffPin(pinModalTargetName, p1);
    hidePinModal();
    await renderStaffList();
  }
}

function fillDestSelect(){
  const sel = document.getElementById('f-dest');
  sel.innerHTML = staff.map(s => `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join('');
}

async function renderStaffList(){
  const el = document.getElementById('staffList');
  el.innerHTML = '<div style="font-size:12.5px;color:var(--muted);">Chargement…</div>';
  const pins = await getStaffPins();
  el.innerHTML = staff.map(s => {
    const hasPin = !!pins[s];
    return `
    <div class="staff-row">
      <span class="staff-name">${escapeHtml(s)}</span>
      <span class="pin-status ${hasPin ? 'set' : 'unset'}">${hasPin ? 'Code défini' : 'Pas de code'}</span>
      <button data-name="${escapeHtml(s)}" class="set-pin-btn">${hasPin ? 'Réinitialiser' : 'Définir un code'}</button>
      <button data-name="${escapeHtml(s)}" class="rm-staff">✕</button>
    </div>`;
  }).join('');

  el.querySelectorAll('.rm-staff').forEach(btn=>{
    btn.onclick = async ()=>{
      const removed = btn.dataset.name;
      staff = staff.filter(s=>s!==removed);
      await saveStaff();
      if(myName === removed){ myName = null; await saveIdentity(""); currentTab = "Mes demandes"; }
      fillDestSelect(); await renderStaffList(); renderIdentityArea(); updateLayout(); renderTabs(); renderScopeNote(); renderTickets();
    };
  });

  el.querySelectorAll('.set-pin-btn').forEach(btn=>{
    btn.onclick = ()=>{
      pinModalMode = 'setStaffByAdmin';
      pinModalTargetName = btn.dataset.name;
      showPinModal(`Définir le code — ${btn.dataset.name}`, `
        <label>Code (4 caractères ou plus)</label>
        <input type="password" id="pinInput1" inputmode="numeric" autocomplete="off">
        <label>Confirmer le code</label>
        <input type="password" id="pinInput2" inputmode="numeric" autocomplete="off">
      `);
    };
  });
}

function renderTabs(){
  const tabsDef = (myName === "Accueil")
    ? ["Tous", "Non traités", "Urgents"]
    : ["Mes demandes", "Non traitées", "Urgentes"];
  if(!tabsDef.includes(currentTab)) currentTab = tabsDef[0];
  const el = document.getElementById('tabs');
  el.innerHTML = tabsDef.map(t =>
    `<div class="tab ${t===currentTab?'active':''}" data-tab="${escapeHtml(t)}">${escapeHtml(t)}</div>`
  ).join('');
  el.querySelectorAll('.tab').forEach(tabEl=>{
    tabEl.onclick = ()=>{ currentTab = tabEl.dataset.tab; renderTabs(); renderTickets(); };
  });
}

// Only Accueil (reception) sees every request. Any other identity only ever
// sees requests addressed to them — this is the base scope applied before
// tabs/search, so switching tabs never reveals someone else's messages.
function getScopedTickets(){
  if(myName === "Accueil") return tickets;
  return tickets.filter(t => t.destinataire === myName);
}

function renderScopeNote(){
  const el = document.getElementById('scopeNote');
  el.textContent = (myName === "Accueil")
    ? "Vue Accueil : toutes les demandes enregistrées."
    : `Vue « ${myName} » : uniquement les demandes qui vous sont adressées.`;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function matchesTab(t){
  if(currentTab === "Tous" || currentTab === "Mes demandes") return true;
  if(currentTab === "Non traités" || currentTab === "Non traitées") return t.status !== "Traité";
  if(currentTab === "Urgents" || currentTab === "Urgentes") return t.urgency === "Urgent";
  return true;
}

function renderTickets(){
  const q = (document.getElementById('searchBox').value || '').toLowerCase();
  const feed = document.getElementById('ticketFeed');
  let list = getScopedTickets().filter(matchesTab);
  if(q){
    list = list.filter(t =>
      (t.name||'').toLowerCase().includes(q) ||
      (t.motif||'').toLowerCase().includes(q) ||
      (t.destinataire||'').toLowerCase().includes(q)
    );
  }
  if(!list.length){
    feed.innerHTML = '<div class="empty">Aucune demande ici pour le moment.</div>';
    return;
  }
  feed.innerHTML = list.map(t => ticketHtml(t)).join('');

  // wire actions
  feed.querySelectorAll('.mark-vu').forEach(b=> b.onclick = ()=> updateStatus(b.dataset.id, 'Vu'));
  feed.querySelectorAll('.mark-traite').forEach(b=> b.onclick = ()=> updateStatus(b.dataset.id, 'Traité'));
  feed.querySelectorAll('.send-reply').forEach(b=> b.onclick = ()=> sendReply(b.dataset.id));
}

function ticketHtml(t){
  const urgentClass = t.urgency === 'Urgent' ? 'urgent' : '';
  const respHtml = (t.responses||[]).map(r =>
    `<div class="resp"><div class="who">${escapeHtml(r.author)} · ${r.time}</div>${escapeHtml(r.text)}</div>`
  ).join('');
  return `
  <div class="ticket ${urgentClass} status-${t.status}" data-id="${t.id}">
    <div class="t-top">
      <div>
        <div class="t-title">${escapeHtml(t.name || 'Sans nom')}
          ${t.urgency==='Urgent' ? '<span class="pill urgent-flag">Urgent</span>' : ''}
        </div>
        <div class="t-meta">${escapeHtml(t.type)} · ${t.createdAt} · saisi par ${escapeHtml(t.loggedBy)}</div>
      </div>
      <span class="pill ${t.status}">${t.status}</span>
    </div>
    <div class="t-body">
      <div class="row"><b>Motif :</b> ${escapeHtml(t.motif || '—')}</div>
      <div class="row"><b>Destinataire :</b> ${escapeHtml(t.destinataire)}</div>
      ${t.phone ? `<div class="row"><b>Contact :</b> ${escapeHtml(t.phone)}</div>` : ''}
    </div>
    <div class="t-actions">
      ${t.status==='Nouveau' ? `<button class="mark-vu" data-id="${t.id}">Marquer « Vu »</button>` : ''}
      ${t.status!=='Traité' ? `<button class="mark-traite go" data-id="${t.id}">Marquer « Traité »</button>` : ''}
    </div>
    <div class="responses">
      ${respHtml}
      <div class="reply-box">
        <textarea placeholder="Répondre / laisser une note pour l'accueil..." id="reply-${t.id}"></textarea>
        <button class="send-reply" data-id="${t.id}">Envoyer</button>
      </div>
    </div>
  </div>`;
}

// ---------- actions ----------
async function updateStatus(id, status){
  const t = tickets.find(x=>x.id===id);
  if(!t) return;
  t.status = status;
  await saveTickets();
  renderTickets();
}

async function sendReply(id){
  const ta = document.getElementById('reply-'+id);
  const text = ta.value.trim();
  if(!text) return;
  const t = tickets.find(x=>x.id===id);
  if(!t) return;
  t.responses = t.responses || [];
  t.responses.push({author: myName, text, time: new Date().toLocaleString('fr-FR')});
  if(t.status === 'Nouveau') t.status = 'Vu';
  await saveTickets();
  renderTickets();
}

async function submitNewTicket(){
  const type = document.getElementById('f-type').value;
  const name = document.getElementById('f-name').value.trim();
  const phone = document.getElementById('f-phone').value.trim();
  const motif = document.getElementById('f-motif').value.trim();
  const dest = document.getElementById('f-dest').value;
  const urgency = document.querySelector('input[name=urg]:checked').value;

  if(!name && !motif){
    alert("Merci d'indiquer au moins le nom du demandeur ou l'objet de la demande.");
    return;
  }
  await loadTickets(); // refresh before appending, avoid overwriting colleagues' updates
  const ticket = {
    id: 't' + Date.now() + Math.random().toString(36).slice(2,7),
    type, name, phone, motif, destinataire: dest, urgency,
    status: 'Nouveau',
    loggedBy: myName,
    createdAt: new Date().toLocaleString('fr-FR'),
    responses: []
  };
  tickets.unshift(ticket);
  await saveTickets();
  seenIds.add(ticket.id);

  document.getElementById('f-name').value = '';
  document.getElementById('f-phone').value = '';
  document.getElementById('f-motif').value = '';
  document.querySelector('input[name=urg][value=Normal]').checked = true;

  renderTickets();
}

// ---------- notifications ----------
function beep(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = 'sine'; o.frequency.value = 880;
    g.gain.value = 0.08;
    o.connect(g); g.connect(ctx.destination);
    o.start();
    setTimeout(()=>{ o.stop(); ctx.close(); }, 220);
  }catch(e){}
}

function updateBadge(count){
  const b = document.getElementById('badgeCount');
  if(count > 0){ b.style.display='inline-block'; b.textContent = count; }
  else { b.style.display='none'; }
}

async function pollForUpdates(){
  const before = tickets;
  await loadTickets();
  const newForMe = tickets.filter(t => !seenIds.has(t.id) && t.destinataire === myName);
  tickets.forEach(t => seenIds.add(t.id));
  if(newForMe.length && alertsOn){
    beep();
    updateBadge(newForMe.length);
    if('Notification' in window && Notification.permission === 'granted'){
      try{
        new Notification('Nouvelle demande pour ' + myName, {
          body: newForMe.map(t=>`${t.name || 'Demande'} — ${t.motif || ''}`).join('\n')
        });
      }catch(e){}
    }
  }
  renderTickets();
}

// ---------- init ----------
async function init(){
  await Promise.all([loadStaff(), loadTickets(), loadIdentity()]);
  if(myName !== "Accueil" && !staff.includes(myName)){
    myName = null; // unknown / not yet authenticated on this device
  }
  renderIdentityArea();
  fillDestSelect();
  renderStaffList();
  updateLayout();
  renderTabs();
  renderScopeNote();
  tickets.forEach(t => seenIds.add(t.id));
  renderTickets();

  document.getElementById('addStaffBtn').onclick = async ()=>{
    const input = document.getElementById('newStaffName');
    const v = input.value.trim();
    if(!v || staff.includes(v)) return;
    staff.push(v);
    await saveStaff();
    input.value = '';
    fillDestSelect(); renderStaffList(); renderIdentityArea(); renderTabs();
  };

  document.getElementById('submitBtn').onclick = submitNewTicket;
  document.getElementById('searchBox').addEventListener('input', renderTickets);

  document.getElementById('bellBtn').onclick = async ()=>{
    alertsOn = !alertsOn;
    document.getElementById('bellBtn').classList.toggle('on', alertsOn);
    if(alertsOn && 'Notification' in window && Notification.permission === 'default'){
      try{ await Notification.requestPermission(); }catch(e){}
    }
    if(alertsOn) beep();
  };

  document.getElementById('pinCancelBtn').onclick = cancelPinModal;
  document.getElementById('pinConfirmBtn').onclick = confirmPinModal;

  // Discreet trigger for the receptionist only: 5 clicks on the title within 2s
  // opens the Accueil access. No visible button, so colleagues never see it.
  let titleClicks = 0;
  let titleClickTimer = null;
  document.getElementById('mainTitle').addEventListener('click', ()=>{
    titleClicks++;
    clearTimeout(titleClickTimer);
    titleClickTimer = setTimeout(()=>{ titleClicks = 0; }, 2000);
    if(titleClicks >= 5){
      titleClicks = 0;
      if(myName !== "Accueil") openAccueilLock();
    }
  });

  pollTimer = setInterval(pollForUpdates, 15000);
}

init();
</script>
